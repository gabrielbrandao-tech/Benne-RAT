<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAT - Preenchimento Digital (IK)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    .modal-fullscreen-mobile { padding: 0 !important; }
    .modal-fullscreen-mobile .modal-dialog { max-width: 100%; height: 100%; margin: 0; }
    .modal-fullscreen-mobile .modal-content { height: 100%; border-radius: 0; }
    #signature-canvas {
      border: 2px dashed #6c757d;
      background-color: #ffffff;
      touch-action: none;
      cursor: crosshair;
      width: 100%;
      height: 300px;
    }
  </style>
</head>

<!-- SCRIPT DE BLOQUEIO / CADEADO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const authUrl = 'https://pfsspthucexjtthlesrh.supabase.co'; 
    const authKey = 'sb_publishable_brfo5xMWne-hmFekJS2lng_q0pMo4q6';
    const authSupabase = window.supabase.createClient(authUrl, authKey);

    async function verificarAcesso() {
      const { data: { session } } = await authSupabase.auth.getSession();

      if (!session) {
        window.location.replace('login.html');
      }

      authSupabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT' || !session) {
          window.location.replace('login.html');
        }
      });
    }
    
    document.addEventListener("DOMContentLoaded", verificarAcesso);
  </script>

<body class="bg-light">

  <main class="container py-4" style="max-width: 800px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0 fs-5">Formulário RAT - Preenchimento</h4>
      </div>

      <div class="card-body">
        <form id="ratForm">

          <!-- IDENTIFICAÇÃO -->
          <h5 class="text-secondary border-bottom pb-2">Identificação</h5>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted small mb-0">Cliente</label>
              <input type="text" id="cliente" class="form-control form-control-sm">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small mb-0">Contato</label>
              <input type="text" id="contato" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
              <label class="form-label text-muted small mb-0">Nº Chamado</label>
              <input type="text" id="chamado" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
              <label class="form-label text-muted small mb-0">Data Agendada (Dia/Mês/Ano)</label>
              <input type="text" id="dataAgendada" class="form-control form-control-sm" placeholder="DD/MM/AAAA">
            </div>
            <div class="col-md-4">
              <label class="form-label text-muted small mb-0">Hora Agendada</label>
              <input type="text" id="horaAgendada" class="form-control form-control-sm" placeholder="HH MM" maxlength="5">
            </div>
          </div>

          <!-- TIPO DE ATENDIMENTO -->
          <h5 class="text-secondary border-bottom pb-2 mt-4">Tipo de Atendimento</h5>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <input type="text" id="tipoAtendimento" class="form-control form-control-sm mb-2" placeholder="Outro tipo de atendimento (opcional)">
            </div>
            <div class="col-md-6">
              <input type="text" id="outroTexto" class="form-control form-control-sm mb-2" placeholder="Especifique o campo 'Outros'">
            </div>
            <div class="col-md-3 form-check mt-2">
              <input class="form-check-input" type="checkbox" id="chkInstalacao">
              <label class="form-check-label" for="chkInstalacao">Instalação</label>
            </div>
            <div class="col-md-3 form-check mt-2">
              <input class="form-check-input" type="checkbox" id="chkManutencao">
              <label class="form-check-label" for="chkManutencao">Manutenção</label>
            </div>
            <div class="col-md-3 form-check mt-2">
              <input class="form-check-input" type="checkbox" id="chkLogistica">
              <label class="form-check-label" for="chkLogistica">Logística</label>
            </div>
            <div class="col-md-3 form-check mt-2">
              <input class="form-check-input" type="checkbox" id="chkDiariaTecnica">
              <label class="form-check-label" for="chkDiariaTecnica">Diária Técnica</label>
            </div>
            <div class="col-md-3 form-check mt-2">
              <input class="form-check-input" type="checkbox" id="chkCabeamento">
              <label class="form-check-label" for="chkCabeamento">Cabeamento</label>
            </div>
          </div>

          <!-- DETALHES DO ATENDIMENTO -->
          <h5 class="text-secondary border-bottom pb-2 mt-4">Detalhes do Serviço</h5>
          <div class="mb-3">
            <label class="form-label text-muted small mb-0">Problemas Relatados</label>
            <textarea id="problemasRelatados" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small mb-0">Motivo Improdutivo (se aplicável)</label>
            <input type="text" id="motivoImprodutivo" class="form-control form-control-sm" placeholder="Ex: Local fechado, sem acesso...">
          </div>

          <!-- HORÁRIOS INÍCIO E TÉRMINO -->
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted small mb-0">Data Início</label>
              <input type="text" id="dataInicio" class="form-control form-control-sm" placeholder="DD/MM/AAAA">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small mb-0">Hora Início</label>
              <input type="text" id="horaInicio" class="form-control form-control-sm" placeholder="HH MM" maxlength="5">
            </div>
            <div class="col-md-6 mt-2">
              <label class="form-label text-muted small mb-0">Data Término</label>
              <input type="text" id="dataTermino" class="form-control form-control-sm" placeholder="DD/MM/AAAA">
            </div>
            <div class="col-md-6 mt-2">
              <label class="form-label text-muted small mb-0">Hora Término</label>
              <input type="text" id="horaTermino" class="form-control form-control-sm" placeholder="HH MM" maxlength="5">
            </div>
          </div>

          <!-- LAUDOS E PEÇAS -->
          <div class="mb-3">
            <label class="form-label text-muted small mb-0">Condições dos Equipamentos</label>
            <textarea id="condicoesEquipamentos" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small mb-0">Peças Substituídas</label>
            <textarea id="pecasSubstituidas" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small mb-0">Relatório Técnico (Com quebra de linha automática)</label>
            <textarea id="relatorioTecnico" class="form-control" rows="4" placeholder="Descreva o relatório técnico..."></textarea>
          </div>

          <!-- AVALIAÇÃO (CHECKBOXES) -->
          <h5 class="text-secondary border-bottom pb-2 mt-4">Avaliação do Atendimento</h5>
          <div class="row g-2 mb-3">
            <div class="col-md-4 form-check">
              <input class="form-check-input" type="checkbox" id="evalOtima">
              <label class="form-check-label" for="evalOtima">Ótima</label>
            </div>
            <div class="col-md-4 form-check">
              <input class="form-check-input" type="checkbox" id="evalMedia">
              <label class="form-check-label" for="evalMedia">Média</label>
            </div>
            <div class="col-md-4 form-check">
              <input class="form-check-input" type="checkbox" id="evalRuim">
              <label class="form-check-label" for="evalRuim">Ruim</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small mb-0">Sugestão / Observações</label>
            <input type="text" id="sugestao" class="form-control form-control-sm">
          </div>

          <!-- DADOS FINAIS E ASSINATURAS -->
          <h5 class="text-secondary border-bottom pb-2 mt-4">Responsáveis e Assinaturas</h5>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted small mb-0">Nome Técnico</label>
              <input type="text" id="nomeTecnico" class="form-control form-control-sm">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small mb-0">Nome Cliente</label>
              <input type="text" id="nomeCliente" class="form-control form-control-sm">
            </div>
            <div class="col-md-12">
              <label class="form-label text-muted small mb-0">Data da Assinatura</label>
              <input type="text" id="dataAssinatura" class="form-control form-control-sm" placeholder="DD/MM/AAAA">
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <button type="button" class="btn btn-outline-primary w-100 py-2" onclick="openSignature('cliente')">
                <span id="statusAssCliente">✍️ Assinatura Cliente</span>
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-outline-secondary w-100 py-2" onclick="openSignature('tecnico')">
                <span id="statusAssTecnico">✍️ Assinatura Técnico</span>
              </button>
            </div>
          </div>

          <!-- BOTAO GERAR PDF -->
          <div class="d-grid gap-2 mt-5">
            <button type="button" id="btnGerar" class="btn btn-success btn-lg fw-bold">
              GERAR E COMPARTILHAR PDF
            </button>
          </div>

        </form>
      </div>
    </div>
  </main>

  <!-- MODAL DE ASSINATURA -->
  <div class="modal fade modal-fullscreen-mobile" id="signatureModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Assine no quadro abaixo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body d-flex flex-column align-items-center justify-content-center bg-light">
          <canvas id="signature-canvas"></canvas>
          <div class="mt-3 w-100 d-flex justify-content-between">
            <button type="button" id="btnClearSignature" class="btn btn-warning fw-bold">Limpar</button>
            <button type="button" class="btn btn-primary fw-bold" onclick="saveSignature()">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const hoje = new Date().toLocaleDateString('pt-BR');
    document.getElementById('dataAgendada').value = hoje;
    document.getElementById('dataInicio').value = hoje;
    document.getElementById('dataTermino').value = hoje;
    document.getElementById('dataAssinatura').value = hoje;

    function mascaraHora(e) {
      let val = e.target.value.replace(/\D/g, '');
      if (val.length > 4) val = val.substring(0, 4);
      if (val.length > 2) {
        val = val.substring(0, 2) + ' ' + val.substring(2, 4);
      }
      e.target.value = val;
    }

    document.getElementById('horaAgendada').addEventListener('input', mascaraHora);
    document.getElementById('horaInicio').addEventListener('input', mascaraHora);
    document.getElementById('horaTermino').addEventListener('input', mascaraHora);


    // ASSINATURAS
    const canvas = document.getElementById("signature-canvas");
    const ctx = canvas.getContext("2d");
    const sigModal = new bootstrap.Modal(document.getElementById('signatureModal'));

    let isDrawing = false;
    let currentSigner = '';
    let signaturesData = { cliente: null, tecnico: null };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width - 32; 
      canvas.height = 300;
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#00008b";
    }

    window.addEventListener("resize", resizeCanvas);
    document.getElementById("signatureModal").addEventListener("shown.bs.modal", resizeCanvas);

    function openSignature(type) {
      currentSigner = type;
      document.getElementById("modalTitle").innerText = type === 'cliente' ? 'Assinatura do Cliente' : 'Assinatura do Técnico';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sigModal.show();
    }

    function saveSignature() {
      signaturesData[currentSigner] = canvas.toDataURL("image/png");
      const btnId = currentSigner === 'cliente' ? 'statusAssCliente' : 'statusAssTecnico';
      document.getElementById(btnId).innerText = "✅ Registado!";
      document.getElementById(btnId).parentElement.classList.replace('btn-outline-primary', 'btn-success');
      document.getElementById(btnId).parentElement.classList.replace('btn-outline-secondary', 'btn-success');
      sigModal.hide();
    }

    document.getElementById("btnClearSignature").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      signaturesData[currentSigner] = null;
    });

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: x - rect.left, y: y - rect.top };
    }

    const startDrawing = (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
    const draw = (e) => { if (!isDrawing) return; e.preventDefault(); ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); };
    const stopDrawing = () => { isDrawing = false; };

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);
    canvas.addEventListener("touchstart", startDrawing, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDrawing);

    // GERAR O PDF VIA SUPABASE
    document.getElementById("btnGerar").addEventListener("click", async function () {
      const btn = document.getElementById("btnGerar");
      
      btn.disabled = true;
      btn.innerText = "A Processar PDF no Servidor...";
      btn.classList.remove('btn-danger', 'btn-primary');
      btn.classList.add('btn-success');

      const oldBackupBtn = document.getElementById("btnBackupDownload");
      if (oldBackupBtn) oldBackupBtn.remove();

      // Monta os dados a enviar
      const pacoteDeDados = {
        cliente: document.getElementById("cliente").value,
        contato: document.getElementById("contato").value,
        chamado: document.getElementById("chamado").value,
        dataAgendada: document.getElementById("dataAgendada").value,
        horaAgendada: document.getElementById("horaAgendada").value,
        tipoAtendimento: document.getElementById("tipoAtendimento").value,
        outroTexto: document.getElementById("outroTexto").value,
        chkInstalacao: document.getElementById("chkInstalacao").checked,
        chkManutencao: document.getElementById("chkManutencao").checked,
        chkLogistica: document.getElementById("chkLogistica").checked,
        chkDiariaTecnica: document.getElementById("chkDiariaTecnica").checked,
        chkCabeamento: document.getElementById("chkCabeamento").checked,
        problemasRelatados: document.getElementById("problemasRelatados").value,
        motivoImprodutivo: document.getElementById("motivoImprodutivo").value,
        dataInicio: document.getElementById("dataInicio").value,
        horaInicio: document.getElementById("horaInicio").value,
        dataTermino: document.getElementById("dataTermino").value,
        horaTermino: document.getElementById("horaTermino").value,
        condicoesEquipamentos: document.getElementById("condicoesEquipamentos").value,
        pecasSubstituidas: document.getElementById("pecasSubstituidas").value,
        relatorioTecnico: document.getElementById("relatorioTecnico").value,
        evalOtima: document.getElementById("evalOtima").checked,
        evalMedia: document.getElementById("evalMedia").checked,
        evalRuim: document.getElementById("evalRuim").checked,
        sugestao: document.getElementById("sugestao").value,
        nomeTecnico: document.getElementById("nomeTecnico").value,
        nomeCliente: document.getElementById("nomeCliente").value,
        dataAssinatura: document.getElementById("dataAssinatura").value,
        assinaturaCliente: signaturesData.cliente,
        assinaturaTecnico: signaturesData.tecnico
      };

      const urlSupabase = 'https://pfsspthucexjtthlesrh.supabase.co/functions/v1/ik-worker';
      const anonKey = 'sb_publishable_brfo5xMWne-hmFekJS2lng_q0pMo4q6';

      try {
        const response = await fetch(urlSupabase, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${anonKey}`,
            'apikey': anonKey
          },
          body: JSON.stringify(pacoteDeDados)
        });

        if (!response.ok) {
            const erroTexto = await response.text();
            throw new Error(erroTexto || "Erro ao conectar com o servidor.");
        }

        const blobPdf = await response.blob();
        const numChamado = document.getElementById("chamado").value || 'Atendimento';
        const fileName = `RAT_IK_${numChamado}.pdf`;
        
        const downloadUrl = URL.createObjectURL(blobPdf);
        const btnBackup = document.createElement("a");
        btnBackup.id = "btnBackupDownload";
        btnBackup.href = downloadUrl;
        btnBackup.download = fileName;
        btnBackup.className = "btn btn-warning btn-lg fw-bold w-100 mt-2";
        btnBackup.innerText = "⬇️ BAIXAR PDF MANUALMENTE (CLIQUE AQUI)";
        
        btn.parentNode.appendChild(btnBackup);

        btn.innerText = "✅ PDF GERADO COM SUCESSO!";
        btn.classList.replace('btn-primary', 'btn-success');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const file = new File([blobPdf], fileName, { type: "application/pdf" });

        if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: "RAT", text: "Segue a RAT preenchida." });
          } catch (e) {
            console.log("Utilizador cancelou a partilha no telemóvel.");
          }
        } else {
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }

      } catch (error) {
        btn.classList.replace('btn-success', 'btn-danger');
        btn.innerText = "ERRO: " + error.message;
        console.error(error);
      } 
      finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
