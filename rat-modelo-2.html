<!-- SCRIPT DE BLOQUEIO / CADEADO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const authUrl = 'https://pfsspthucexjtthlesrh.supabase.co'; 
    const authKey = 'sb_publishable_brfo5xMWne-hmFekJS2lng_q0pMo4q6';
    const authSupabase = window.supabase.createClient(authUrl, authKey);

    async function verificarAcesso() {
      const { data: { session } } = await authSupabase.auth.getSession();

      if (!session) {
        window.location.replace('login.html');
      }

      authSupabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT' || !session) {
          window.location.replace('login.html');
        }
      });
    }
    
    document.addEventListener("DOMContentLoaded", verificarAcesso);
  </script>

  <!-- MODAL DE ASSINATURA -->
  <div class="modal fade modal-fullscreen-mobile" id="signatureModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Assine no quadro abaixo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body d-flex flex-column align-items-center justify-content-center bg-light">
          <canvas id="signature-canvas"></canvas>
          <div class="mt-3 w-100 d-flex justify-content-between">
            <button type="button" id="btnClearSignature" class="btn btn-warning fw-bold">Limpar</button>
            <button type="button" class="btn btn-primary fw-bold" onclick="saveSignature()">Confirmar</button>
          </div>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('data').value = new Date().toLocaleDateString('pt-BR');

    // CONTROLO DE DUPLA ASSINATURA
    const canvas = document.getElementById("signature-canvas");
    const ctx = canvas.getContext("2d");
    const sigModal = new bootstrap.Modal(document.getElementById('signatureModal'));

    let isDrawing = false;
    let currentSigner = '';
    let signaturesData = { responsavel: null, tecnico: null };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width - 32;
      canvas.height = 300;
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#00008b";
    }

    window.addEventListener("resize", resizeCanvas);
    document.getElementById("signatureModal").addEventListener("shown.bs.modal", resizeCanvas);

    function openSignature(type) {
      currentSigner = type;
      document.getElementById("modalTitle").innerText = type === 'responsavel' ? 'Assinatura do Responsável' : 'Assinatura do Técnico';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sigModal.show();
    }

    function saveSignature() {
      signaturesData[currentSigner] = canvas.toDataURL("image/png");
      const btnId = currentSigner === 'responsavel' ? 'statusAssResponsavel' : 'statusAsstecnico';
      document.getElementById(btnId).innerText = "✅ Registado!";
      document.getElementById(btnId).parentElement.classList.replace('btn-outline-danger', 'btn-success');
      document.getElementById(btnId).parentElement.classList.replace('btn-outline-secondary', 'btn-success');
      sigModal.hide();
    }

    document.getElementById("btnClearSignature").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      signaturesData[currentSigner] = null;
    });

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: x - rect.left, y: y - rect.top };
    }

    const startDrawing = (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
    const draw = (e) => { if (!isDrawing) return; e.preventDefault(); ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); };
    const stopDrawing = () => { isDrawing = false; };

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);
    canvas.addEventListener("touchstart", startDrawing, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDrawing);

    // GERAR O PDF VIA SUPABASE
    document.getElementById("btnGerar").addEventListener("click", async function () {
      const btn = document.getElementById("btnGerar");

      btn.disabled = true;
      btn.innerText = "A Processar PDF no Servidor...";
      btn.classList.remove('btn-danger', 'btn-primary');
      btn.classList.add('btn-success');

      const oldBackupBtn = document.getElementById("btnBackupDownload");
      if (oldBackupBtn) oldBackupBtn.remove();

      // Mapeia os Checkboxes para enviar ao servidor
      const idsEquipamentos = [
        'eq_nettop_lojas', 'eq_nettop_regional', 'eq_nettop_tv', 'eq_android_box', 'eq_notebook_lojas', 'eq_notebook_corp', 'eq_servidor', 'eq_servidor_dlbc',
        'eq_teclado', 'eq_mouse', 'eq_monitor', 'eq_scanner', 'eq_imp_recibos', 'eq_leitora_doc', 'eq_leitora_barras', 'eq_imp_autenticadora',
        'eq_pinpad_cripto', 'eq_pin_liso', 'eq_adaptador_pin', 'eq_hub_usb', 'eq_leitor_digital', 'eq_webcam', 'eq_telefone'
      ];
      
      const equipamentosMarcados = {};
      idsEquipamentos.forEach(id => {
        const el = document.getElementById(id);
        equipamentosMarcados[id] = el ? el.checked : false;
      });

      // Constrói o JSON com todos os dados do formulário
      const pacoteDeDados = {
        chamado: document.getElementById("chamado").value,
        agencia: document.getElementById("agencia").value,
        endereco: document.getElementById("endereco").value,
        numero: document.getElementById("numero").value,
        complemento: document.getElementById("complemento").value,
        bairro: document.getElementById("bairro").value,
        municipio: document.getElementById("municipio").value,
        uf: document.getElementById("uf").value,
        defeitoCausa: document.getElementById("defeitoCausa").value,
        hrPartida: document.getElementById("hrPartida").value,
        hrChegada: document.getElementById("hrChegada").value,
        hrInicio: document.getElementById("hrInicio").value,
        hrTermino: document.getElementById("hrTermino").value,
        patAntigo: document.getElementById("patAntigo").value,
        serieAntigo: document.getElementById("serieAntigo").value,
        modeloAntigo: document.getElementById("modeloAntigo").value,
        hostAntigo: document.getElementById("hostAntigo").value,
        macAntigo: document.getElementById("macAntigo").value,
        patNovo: document.getElementById("patNovo").value,
        serieNovo: document.getElementById("serieNovo").value,
        modeloNovo: document.getElementById("modeloNovo").value,
        hostNovo: document.getElementById("hostNovo").value,
        macNovo: document.getElementById("macNovo").value,
        descricao: document.getElementById("descricao").value,
        suporte: document.getElementById("suporte").value,
        tecnico: document.getElementById("tecnico").value,
        documentotecnico: document.getElementById("documentotecnico").value,
        responsavel: document.getElementById("responsavel").value,
        documento: document.getElementById("documento").value,
        local: document.getElementById("local").value,
        data: document.getElementById("data").value,
        equipamentosMarcados: equipamentosMarcados,
        assinaturaResponsavel: signaturesData.responsavel,
        assinaturaTecnico: signaturesData.tecnico
      };

      const urlSupabase = 'https://pfsspthucexjtthlesrh.supabase.co/functions/v1/santander-api';
      const anonKey = 'sb_publishable_brfo5xMWne-hmFekJS2lng_q0pMo4q6'; 

      try {
        const response = await fetch(urlSupabase, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${anonKey}`,
            'apikey': anonKey
          },
          body: JSON.stringify(pacoteDeDados)
        });

        if (!response.ok) {
            const erroTexto = await response.text();
            throw new Error(erroTexto || "Erro ao conectar com o servidor.");
        }

        const blobPdf = await response.blob();
        const numChamado = document.getElementById("chamado").value || "SemChamado";
        const fileName = `RAT_SANTANDER_${numChamado}.pdf`;
        const downloadUrl = URL.createObjectURL(blobPdf);

        const btnBackup = document.createElement("a");
        btnBackup.id = "btnBackupDownload";
        btnBackup.href = downloadUrl;
        btnBackup.download = fileName;
        btnBackup.className = "btn btn-warning btn-lg fw-bold w-100 mt-2";
        btnBackup.innerText = "⬇️ BAIXAR PDF MANUALMENTE (CLIQUE AQUI)";
        btn.parentNode.appendChild(btnBackup);

        btn.innerText = "✅ PDF GERADO COM SUCESSO!";
        btn.classList.replace('btn-primary', 'btn-success');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const file = new File([blobPdf], fileName, { type: "application/pdf" });

        if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: "RAT Santander", text: "Segue a RAT preenchida." });
          } catch (e) {
            console.log("Usuário cancelou o compartilhamento no celular.");
          }
        } 
        else {
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
      } catch (error) {
        btn.classList.replace('btn-success', 'btn-danger');
        btn.innerText = "ERRO: " + error.message;
        console.error(error);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
